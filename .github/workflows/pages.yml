name: GitHub Pages'e Yayinla

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js'i hazirla
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Siteyi olustur
        run: npm run build

      - name: Pages'i hazirla
        uses: actions/configure-pages@v5

      - name: Site dosyalarini yukle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

      - name: Siteyi yayinla
        id: deployment
        uses: actions/deploy-pages@v4
